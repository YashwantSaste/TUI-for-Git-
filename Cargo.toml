[package]
name = "gitwave"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gitwave"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
anyhow = "1"
fuzzy-matcher = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
